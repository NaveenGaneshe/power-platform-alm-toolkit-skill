name: Bug report
description: The skill produced wrong, unsafe or broken output, or a script failed
labels: [bug]
body:
  - type: dropdown
    id: tool
    attributes:
      label: AI tool
      options: [Claude Code, Claude app, OpenAI Codex, GitHub Copilot, Cursor, Gemini CLI, ChatGPT custom GPT, Gemini Gem, Copilot Studio, Other]
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and skill version
      placeholder: e.g. Claude Opus 5.5, skill v0.1.0
  - type: textarea
    id: prompt
    attributes:
      label: Prompt you used
      description: Remove tenant names, URLs and anything confidential.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What was wrong
      description: e.g. invented PAC flag, missing test-run default, YAML error. Paste the relevant excerpt and any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected (with a docs link if it's a factual error)
