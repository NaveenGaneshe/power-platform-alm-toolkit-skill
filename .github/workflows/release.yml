name: Release

# Push a tag like v0.1.0 to publish a GitHub release with the downloadable packages attached.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Check the tag matches the skill version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          skill_version=$(grep -m1 -E '^\s+version:' skills/power-platform-alm-toolkit/SKILL.md | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$tag" != "$skill_version" ]; then
            echo "Tag v$tag does not match SKILL.md metadata.version $skill_version" >&2
            exit 1
          fi
      - run: python scripts/validate.py
      - run: python scripts/check_templates.py
      - run: python scripts/build.py
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/power-platform-alm-toolkit.zip
            dist/portable/power-platform-alm-toolkit.md
            dist/portable/power-platform-alm-toolkit.instructions.md
            dist/SHA256SUMS.txt
