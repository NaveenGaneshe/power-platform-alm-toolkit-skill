name: Release

# Publish a release on GitHub (Releases → Draft a new release → tag vX.Y.Z → Publish).
# This workflow then validates, builds and attaches the downloadable packages to it.
# To rebuild the files for an existing release, run it manually from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build files for, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Check the tag matches the skill version
        shell: bash
        run: |
          tag="${TAG#v}"
          skill_version=$(grep -m1 -E '^\s+version:' skills/power-platform-alm-toolkit/SKILL.md | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$tag" != "$skill_version" ]; then
            echo "Release tag v$tag does not match SKILL.md metadata.version $skill_version" >&2
            exit 1
          fi
      - run: python scripts/validate.py
      - run: python scripts/check_templates.py
      - run: python scripts/build.py
      - name: Attach packages to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/power-platform-alm-toolkit.zip
            dist/portable/power-platform-alm-toolkit.md
            dist/portable/power-platform-alm-toolkit.instructions.md
            dist/SHA256SUMS.txt
